name: Prepare release notes
on:
  workflow_call:
    inputs:
      product:
        required: true
        type: string
      source_repositories:
        required: true
        type: string
      days:
        default: 7
        type: number
    secrets:
      OPENROUTER_API_KEY:
        required: true
      RELEASE_NOTES_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4
        with:
          repository: fulldiveVR/release-notes
          token: ${{ secrets.RELEASE_NOTES_TOKEN }}
          path: release-notes

      - name: Collect source history
        id: history
        env:
          GH_TOKEN: ${{ secrets.RELEASE_NOTES_TOKEN }}
          SOURCE_REPOSITORIES: ${{ inputs.source_repositories }}
          DAYS: ${{ inputs.days }}
        shell: bash
        run: |
          set -euo pipefail
          since="$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)"
          : > history.jsonl
          while IFS= read -r repository; do
            test -n "$repository" || continue
            gh api --paginate "repos/$repository/commits?since=$since&per_page=100" \
              --jq '.[] | {repository: "'"$repository"'", date: .commit.author.date, message: .commit.message}' \
              >> history.jsonl
          done <<< "$SOURCE_REPOSITORIES"
          test -s history.jsonl || echo '{"no_changes":true}' > history.jsonl

      - name: Draft public note with Luna
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PRODUCT: ${{ inputs.product }}
        shell: bash
        run: |
          set -euo pipefail
          python3 release-notes/scripts/prepare.py \
            --product "$PRODUCT" \
            --history history.jsonl \
            --output release-notes

      - name: Validate draft
        run: python3 release-notes/scripts/validate.py

      - name: Publish to main
        working-directory: release-notes
        env:
          PRODUCT: ${{ inputs.product }}
        shell: bash
        run: |
          set -euo pipefail
          git add _releases
          if git diff --cached --quiet; then
            echo "No release note to publish"
            exit 0
          fi
          git config user.name "release-notes-bot"
          git config user.email "release-notes-bot@users.noreply.github.com"
          git commit -m "docs($PRODUCT): weekly release notes"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
