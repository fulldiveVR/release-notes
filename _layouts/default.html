<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#07070a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  </head>
  <body class="{% if page.product %}product-{{ page.product }}{% endif %}">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="FullDive release notes home">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
          <span>FullDive <b>Releases</b></span>
        </a>
        <nav aria-label="Product releases">
          <a href="{{ '/roomcord/' | relative_url }}">Roomcord</a>
          <a href="{{ '/autoworker-hub/' | relative_url }}">Autoworker Hub</a>
          <a href="{{ '/hermes-hub/' | relative_url }}">Hermes Hub</a>
        </nav>
        <a class="github-link" href="https://github.com/fulldiveVR/release-notes">GitHub <span aria-hidden="true">↗</span></a>
      </div>
    </header>
    <main id="main">{{ content }}</main>
    <footer class="site-footer">
      <div class="shell footer-inner">
        <div>
          <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true"><i></i><i></i></span><span>FullDive <b>Releases</b></span></a>
          <p>Source-backed updates for products we actively build.</p>
        </div>
        <div class="footer-links">
          <a href="{{ '/feed.xml' | relative_url }}">Atom feed</a>
          <a href="https://github.com/fulldiveVR/release-notes">Source on GitHub</a>
        </div>
      </div>
    </footer>
  </body>
</html>
