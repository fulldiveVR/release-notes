<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  </head>
  <body>
    <header><a href="{{ '/' | relative_url }}">{{ site.title }}</a></header>
    <main>{{ content }}</main>
    <footer><a href="{{ '/feed.xml' | relative_url }}">Atom feed</a> · <a href="https://github.com/fulldiveVR/release-notes">GitHub</a></footer>
  </body>
</html>
