---
layout: default
---
<article>
  <p class="product"><a href="{{ '/' | append: page.product | append: '/' | relative_url }}">{{ page.product_name }}</a></p>
  <h1>{{ page.title }}</h1>
  <p class="date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>{% if page.version %} · {{ page.version }}{% endif %}</p>
  {{ content }}
</article>
